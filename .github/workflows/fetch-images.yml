# Temporary helper: downloads generated card images into the repo.
# Removed again before this branch is merged.
name: Fetch card images
on:
  push:
    branches: [card-photos]
    paths: ['.github/image-urls.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p warehouse/assets/img/raw
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSfL "$url" -o "warehouse/assets/img/raw/$name.png"
          done < .github/image-urls.txt
          ls -la warehouse/assets/img/raw
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add warehouse/assets/img/raw
          git commit -m "Fetch generated card images"
          git push
